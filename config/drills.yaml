# Failure drills. Simulated drills replay one working day of the workload with a fault injected;
# real drills run on a temporary lake. Times are UTC on the drill day.
day: 2026-09-23                 # a Wednesday in the simulated month
spark_down: {start: "10:00", end: "10:40"}
catalog_latency: {start: "14:00", end: "15:00", extra_s: 2.5}
query_storm: {start: "11:00", end: "11:10", per_second: 40, template: storm_lookup}
late_upstream: {table: raw.trades, delay_min: 180}
bad_batch: {negative_amounts: 50, duplicate_ids: 20}
