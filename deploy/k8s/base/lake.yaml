# The lake for kind and development clusters: MinIO for storage and the Iceberg REST catalog.
# On AWS these are S3 and the Glue Iceberg REST endpoint (deploy/terraform).
apiVersion: v1
kind: Secret
metadata: {name: apr-s3, namespace: analytics}
stringData: {AWS_ACCESS_KEY_ID: minio, AWS_SECRET_ACCESS_KEY: minio-dev-only}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: analytics}
spec:
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: apr-s3, key: AWS_ACCESS_KEY_ID}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: apr-s3, key: AWS_SECRET_ACCESS_KEY}}}
          ports: [{containerPort: 9000}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: analytics}
spec: {selector: {app: minio}, ports: [{port: 9000}]}
---
apiVersion: batch/v1
kind: Job
metadata: {name: create-bucket, namespace: analytics}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          envFrom: [{secretRef: {name: apr-s3}}]
          command: [sh, -c, 'mc alias set lake http://minio:9000 $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY && mc mb -p lake/lake']
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iceberg-rest, namespace: analytics}
spec:
  selector: {matchLabels: {app: iceberg-rest}}
  template:
    metadata: {labels: {app: iceberg-rest}}
    spec:
      containers:
        - name: rest
          image: apache/iceberg-rest-fixture:1.9.2
          envFrom: [{secretRef: {name: apr-s3}}]
          env:
            - {name: AWS_REGION, value: us-east-1}
            - {name: CATALOG_WAREHOUSE, value: "s3://lake/"}
            - {name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO}
            - {name: CATALOG_S3_ENDPOINT, value: "http://minio:9000"}
            - {name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true"}
          ports: [{containerPort: 8181}]
          readinessProbe: {httpGet: {path: /v1/config, port: 8181}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: iceberg-rest, namespace: analytics}
spec: {selector: {app: iceberg-rest}, ports: [{port: 8181}]}
