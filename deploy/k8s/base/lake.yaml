# The lake for kind and development clusters: S3-compatible storage and the Iceberg REST catalog.
# On AWS these are S3 and the Glue Iceberg REST endpoint (deploy/terraform).
apiVersion: v1
kind: Secret
metadata: {name: apr-s3, namespace: analytics}
stringData: {AWS_ACCESS_KEY_ID: dev, AWS_SECRET_ACCESS_KEY: dev-only}
---
# S3-compatible object storage for kind and development. MinIO stopped publishing images in
# 2025, so this uses Adobe's S3Mock (path-style, any credentials, the bucket created at start).
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3, namespace: analytics}
spec:
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      containers:
        - name: s3
          image: adobe/s3mock:3.12.0
          env:
            - {name: initialBuckets, value: lake}                                   # S3Mock 3.x
            - {name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS, value: lake}   # S3Mock 4.x
            - {name: COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT, value: "false"}
          ports: [{containerPort: 9090}]
          readinessProbe: {tcpSocket: {port: 9090}, initialDelaySeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: s3, namespace: analytics}
spec: {selector: {app: s3}, ports: [{port: 9000, targetPort: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iceberg-rest, namespace: analytics}
spec:
  selector: {matchLabels: {app: iceberg-rest}}
  template:
    metadata: {labels: {app: iceberg-rest}}
    spec:
      containers:
        - name: rest
          image: apache/iceberg-rest-fixture:1.9.2
          envFrom: [{secretRef: {name: apr-s3}}]
          env:
            - {name: AWS_REGION, value: us-east-1}
            - {name: CATALOG_WAREHOUSE, value: "s3://lake/"}
            - {name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO}
            - {name: CATALOG_S3_ENDPOINT, value: "http://s3:9000"}
            - {name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true"}
          ports: [{containerPort: 8181}]
          readinessProbe: {httpGet: {path: /v1/config, port: 8181}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: iceberg-rest, namespace: analytics}
spec: {selector: {app: iceberg-rest}, ports: [{port: 8181}]}
