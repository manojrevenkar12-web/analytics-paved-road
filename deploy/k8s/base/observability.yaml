# Prometheus with the generated SLO rules, and Grafana with the generated dashboard.
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: analytics}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s, evaluation_interval: 30s}
    rule_files: [/etc/prometheus/rules/*.yaml]
    scrape_configs:
      - job_name: apr-gateway
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [analytics]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - {source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port], separator: ":", target_label: __address__}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: analytics}
spec:
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.1
          args: [--config.file=/etc/prometheus/prometheus.yml]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: rules, mountPath: /etc/prometheus/rules}
      volumes:
        - {name: config, configMap: {name: prometheus}}
        - {name: rules, configMap: {name: apr-slo-rules}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: analytics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: analytics}
rules: [{apiGroups: [""], resources: [pods], verbs: [get, list, watch]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: analytics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: analytics}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: analytics}
spec: {selector: {app: prometheus}, ports: [{port: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: analytics}
spec:
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.0.2
          env: [{name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}]
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: providers, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: providers, configMap: {name: grafana-providers}}
        - {name: dashboards, configMap: {name: apr-dashboards}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasources, namespace: analytics}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources: [{name: Prometheus, uid: prometheus, type: prometheus, url: "http://prometheus:9090", isDefault: true}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-providers, namespace: analytics}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers: [{name: paved-road, folder: Platform, type: file, options: {path: /var/lib/grafana/dashboards}}]
