- name: slo-freshness
  rules:
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="cash_movements"}[30d])
    labels:
      product: cash_movements
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="customer_month"}[30d])
    labels:
      product: customer_month
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="customers"}[30d])
    labels:
      product: customers
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="daily_trading"}[30d])
    labels:
      product: daily_trading
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="instruments"}[30d])
    labels:
      product: instruments
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="prices_daily"}[30d])
    labels:
      product: prices_daily
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="savings_plans"}[30d])
    labels:
      product: savings_plans
  - record: slo:apr_product_freshness:error_ratio30d
    expr: 1 - avg_over_time(apr_product_freshness_on_time{product="trades"}[30d])
    labels:
      product: trades
  - alert: APR_ProductLate
    expr: time() - apr_product_data_through_timestamp_seconds{product="cash_movements"} > 108000
    for: 10m
    labels:
      severity: ticket
      product: cash_movements
      team: banking-data
    annotations:
      summary: raw.cash_movements has no data for yesterday after 06:00 UTC
      contact: '#banking-data'
      runbook: docs/runbooks/late_data.md
  - alert: APR_ProductLate
    expr: time() - apr_product_data_through_timestamp_seconds{product="customer_month"} > 111600
    for: 10m
    labels:
      severity: page
      product: customer_month
      team: customer-analytics
    annotations:
      summary: mart.customer_month has no data for yesterday after 07:00 UTC
      contact: '#customer-analytics'
      runbook: docs/runbooks/late_data.md
  - alert: APR_ProductLate
    expr: time() - apr_product_data_through_timestamp_seconds{product="customers"} > 104400
    for: 10m
    labels:
      severity: ticket
      product: customers
      team: customer-data
