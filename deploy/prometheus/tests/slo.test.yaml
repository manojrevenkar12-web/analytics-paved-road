# Generated by `apr generate`. Run: promtool test rules deploy/prometheus/tests/slo.test.yaml
rule_files:
- ../rules/slo.rules.yaml
evaluation_interval: 1m
tests:
- name: '10% of accepted queries fail: every availability alert fires'
  interval: 1m
  input_series:
  - series: apr_gateway_requests_total{lane="fast",role="analyst",outcome="ok"}
    values: 0+90x120
  - series: apr_gateway_requests_total{lane="fast",role="analyst",outcome="engine_error"}
    values: 0+10x120
  alert_rule_test:
  - eval_time: 70m
    alertname: APR_GatewayAvailability_PageFast
    exp_alerts:
    - exp_labels:
        severity: page
        slo: gateway_availability
      exp_annotations:
        summary: 'Queries the platform accepted that did not fail on the platform''s side: error budget burning 14.4x'
        runbook: docs/runbooks/gateway_availability.md
  - eval_time: 70m
    alertname: APR_GatewayAvailability_PageSlow
    exp_alerts:
    - exp_labels:
        severity: page
        slo: gateway_availability
      exp_annotations:
        summary: 'Queries the platform accepted that did not fail on the platform''s side: error budget burning 6x'
        runbook: docs/runbooks/gateway_availability.md
  - eval_time: 70m
    alertname: APR_GatewayAvailability_TicketFast
    exp_alerts:
    - exp_labels:
        severity: ticket
        slo: gateway_availability
      exp_annotations:
        summary: 'Queries the platform accepted that did not fail on the platform''s side: error budget burning 3x'
        runbook: docs/runbooks/gateway_availability.md
  - eval_time: 70m
    alertname: APR_GatewayAvailability_TicketSlow
    exp_alerts:
    - exp_labels:
        severity: ticket
        slo: gateway_availability
      exp_annotations:
        summary: 'Queries the platform accepted that did not fail on the platform''s side: error budget burning 1x'
        runbook: docs/runbooks/gateway_availability.md
- name: '0.1% fail and many refusals: refusals are not failures, nothing fires'
  interval: 1m
  input_series:
  - series: apr_gateway_requests_total{lane="fast",role="analyst",outcome="ok"}
    values: 0+999x120
  - series: apr_gateway_requests_total{lane="fast",role="analyst",outcome="engine_error"}
    values: 0+1x120
  - series: apr_gateway_requests_total{lane="none",role="product_manager",outcome="refused"}
    values: 0+400x120
  alert_rule_test:
  - eval_time: 70m
    alertname: APR_GatewayAvailability_PageFast
    exp_alerts: []
  - eval_time: 70m
    alertname: APR_GatewayAvailability_PageSlow
    exp_alerts: []
  - eval_time: 70m
    alertname: APR_GatewayAvailability_TicketFast
    exp_alerts: []
  - eval_time: 70m
    alertname: APR_GatewayAvailability_TicketSlow
    exp_alerts: []
- name: 'daily_trading has no data for yesterday after its contract time: page'
  interval: 1m
  input_series:
  - series: apr_product_data_through_timestamp_seconds{product="daily_trading"}
    values: '0x2100'
  alert_rule_test:
  - eval_time: 1850m
    alertname: APR_ProductLate
    exp_alerts: []
  - eval_time: 1875m
    alertname: APR_ProductLate
    exp_alerts:
    - exp_labels:
        severity: page
        product: daily_trading
        team: brokerage-analytics
      exp_annotations:
        summary: mart.daily_trading has no data for yesterday after 07:00 UTC
        contact: '#brokerage-analytics'
        runbook: docs/runbooks/late_data.md
