cases:
  # ------------------------------------------------------------ product_manager
  - id: a01
    user: pia
    sql: "SELECT country, segment, COUNT(*) AS customers FROM raw.customers GROUP BY country, segment"
    expect: allow
    masked: []
    note: "public and internal columns in clear for a product manager"
  - id: a02
    user: pia
    sql: "SELECT * FROM raw.customers LIMIT 100"
    expect: allow
    masked: []
    note: "SELECT * does not refuse; the PII columns are simply left out"
  - id: a03
    user: pia
    sql: "SELECT country, COUNT(*) FROM raw.customers WHERE birth_date >= DATE '2000-01-01' GROUP BY country"
    expect: refuse
    rule: denied_column
    note: "pii_quasi named only in WHERE still refuses for a product manager"
  - id: a04
    user: pia
    sql: "SELECT n FROM (SELECT full_name AS n FROM raw.customers) s"
    expect: refuse
    rule: denied_column
    note: "renaming a denied column in a sub-query does not hide it"
  - id: a05
    user: pia
    sql: "SELECT name FROM raw.instruments UNION ALL SELECT email FROM raw.customers"
    expect: refuse
    rule: denied_column
    note: "UNION with a denied column from another table"
  - id: a06
    user: pia
    sql: "SELECT `EMAIL` FROM `raw`.`customers` LIMIT 10"
    expect: refuse
    rule: denied_column
    note: "quoting and upper case do not change which column it is"
  - id: a07
    user: pia
    sql: "SELECT channel, SUM(amount_eur) AS volume FROM raw.trades WHERE executed_at BETWEEN TIMESTAMP '2026-09-21 00:00:00' AND TIMESTAMP '2026-09-27 23:59:59' GROUP BY channel"
    expect: allow
    masked: []
    note: "financial in clear for a product manager; BETWEEN timestamps is a partition filter"
  - id: a08
    user: pia
    sql: "SELECT side, COUNT(*) FROM raw.trades WHERE side = 'buy' GROUP BY side"
    expect: refuse
    rule: partition_filter_required
    note: "a filter on another column only is not a partition filter"
  - id: a09
    user: pia
    sql: "SELECT COUNT(*) FROM raw.customers a JOIN raw.customers b ON a.iban = b.iban AND a.customer_id <> b.customer_id"
    expect: refuse
    rule: denied_column
    note: "a denied column in a join condition refuses (looking for shared IBANs)"
  - id: a10
    user: pia
    sql: "SELECT * FROM information_schema.columns"
    expect: refuse
    rule: unknown_table
    note: "system tables are not data products"
  - id: a11
    user: pia
    sql: "SELECT customer_id, phone FROM raw.customers"
    expect: refuse
    rule: unknown_column
    note: "raw.customers has no phone column"
  - id: a12
    user: pia
    sql: "SELECT country, COUNT(* FROM raw.customers GROUP BY country"
    expect: refuse
    rule: parse_error
    note: "unbalanced parenthesis"
  # -------------------------------------------------------------------- analyst
  - id: a13
    user: ana
    sql: "SELECT * FROM raw.customers LIMIT 100"
    expect: allow
    masked: [raw.customers.full_name, raw.customers.email, raw.customers.iban, raw.customers.birth_date]
    note: "SELECT * for an analyst returns every PII column masked"
  - id: a14
    user: ben
    sql: "SELECT email, COUNT(*) AS n FROM raw.customers GROUP BY email HAVING COUNT(*) > 1"
    expect: allow
    masked: [raw.customers.email]
    note: "grouping on a masked column still works for finding duplicates"
  - id: a15
    user: ana
    sql: "SELECT year(birth_date) AS birth_year, COUNT(*) FROM raw.customers GROUP BY year(birth_date)"
    expect: allow
    masked: [raw.customers.birth_date]
    note: "a function over a masked date reads the masked value (first day of the year)"
  - id: a16
    user: ana
    sql: "WITH c AS (SELECT customer_id, iban FROM raw.customers) SELECT c.iban, SUM(t.amount_eur) AS volume FROM c JOIN raw.trades t ON t.customer_id = c.customer_id WHERE t.executed_at >= DATE '2026-09-21' GROUP BY c.iban ORDER BY volume DESC LIMIT 50"
    expect: allow
    masked: [raw.customers.iban]
    note: "CTE over a masked column joined to trades; partition filter is a comparison with a date"
  - id: a17
    user: ana
    sql: "SELECT c.country, COUNT(DISTINCT t.customer_id) AS traders FROM raw.customers c JOIN raw.trades t ON t.customer_id = c.customer_id AND t.executed_at >= TIMESTAMP '2026-09-22 00:00:00' GROUP BY c.country"
    expect: allow
    masked: []
    note: "partition filter in the ON of the join that brings raw.trades in"
  - id: a18
    user: ana
    sql: "SELECT customer_id, country FROM raw.customers WHERE email = 'anna@example.org'"
    expect: allow
    masked: [raw.customers.email]
    note: "a filter on a masked column compares against the masked value; allowed, matches nothing"
  - id: a19
    user: ben
    sql: "SELECT customer_id, signup_at FROM raw.customers ORDER BY full_name LIMIT 20"
    expect: allow
    masked: [raw.customers.full_name]
    note: "a masked column used only in ORDER BY is still read"
  - id: a20
    user: ben
    sql: "SELECT CAST(executed_at AS DATE) AS d, COUNT(*) FROM raw.trades WHERE CAST(executed_at AS DATE) IN (DATE '2026-09-27', DATE '2026-09-28') GROUP BY CAST(executed_at AS DATE)"
    expect: allow
    masked: []
    note: "IN on a cast of the partition column counts"
  - id: a21
    user: ben
    sql: "select Country, count(*) as n from LAKE.Raw.CUSTOMERS group by Country"
    expect: allow
    masked: []
    note: "table names are case-insensitive, lake. prefix is accepted"
  - id: a22
    user: ana
    sql: "SELECT price_date, close_eur FROM `lake`.`raw`.`prices_daily` WHERE isin = 'DE0007164600' ORDER BY price_date"
    expect: allow
    masked: []
    note: "quoted lake.raw name; prices_daily does not require a partition filter"
  - id: a23
    user: ben
    sql: "SELECT name FROM raw.instruments WHERE name <> 'a;b' /* ; DROP TABLE raw.trades */"
    expect: allow
    masked: []
    note: "semicolons inside a string and a comment do not make a second statement"
  - id: a24
    user: ben
    sql: "SELECT t.trade_id FROM raw.customers c JOIN raw.trades t ON t.customer_id = c.customer_id WHERE t.executed_at >= c.signup_at"
    expect: refuse
    rule: partition_filter_required
    note: "the partition column compared with another column, not a constant"
  - id: a25
    user: ben
    sql: "SELECT COUNT(*) FROM (SELECT trade_id, executed_at FROM raw.trades) x WHERE x.executed_at >= DATE '2026-09-01'"
    expect: refuse
    rule: partition_filter_required
    note: "the filter is in the outer block, not in the query block that reads raw.trades"
  - id: a26
    user: ben
    sql: "SELECT * FROM read_parquet('s3://lake/warehouse/raw/customers/')"
    expect: refuse
    rule: table_function
    note: "reading the table's files directly to get around masking"
  - id: a27
    user: ben
    sql: "SET spark.sql.ansi.enabled = false"
    expect: refuse
    rule: read_only
    note: "setting a session option"
  - id: a28
    user: ana
    sql: "SELECT * FROM mart.customer_ltv"
    expect: refuse
    rule: unknown_table
    note: "no such data product"
  - id: a29
    user: ana
    sql: "CREATE TABLE mart.my_customers AS SELECT customer_id, country FROM raw.customers"
    expect: refuse
    rule: read_only
    note: "creating a table is a write"
  # ----------------------------------------------------------------- compliance
  - id: a30
    user: carl
    sql: "SELECT full_name, email, iban, birth_date FROM raw.customers WHERE customer_id = 'C-000123'"
    expect: allow
    masked: []
    note: "compliance sees PII in clear"
  - id: a31
    user: carl
    sql: "SELECT type, SUM(amount_eur) AS total FROM raw.cash_movements WHERE CAST(booked_at AS DATE) = DATE '2026-09-28' GROUP BY type"
    expect: allow
    masked: []
    note: "equality on a cast of booked_at is a partition filter"
  - id: a32
    user: carl
    sql: "SELECT m.customer_id, m.deposits_eur, c.iban FROM mart.customer_month m JOIN lake.raw.customers c ON c.customer_id = m.customer_id WHERE m.month = DATE '2026-08-01' AND m.deposits_eur > 50000"
    expect: allow
    masked: []
    note: "investigating large deposits with IBANs; lake. prefix on one table"
  - id: a33
    user: carl
    sql: "SELECT customer_id, SUM(amount_eur) FROM raw.cash_movements WHERE type = 'withdrawal' GROUP BY customer_id"
    expect: refuse
    rule: partition_filter_required
    note: "even compliance must filter raw.cash_movements on booked_at"
  - id: a34
    user: carl
    sql: "DELETE FROM raw.customers WHERE customer_id = 'C-000123'"
    expect: refuse
    rule: read_only
    note: "seeing everything does not mean writing"
  - id: a35
    user: carl
    sql: "SELECT name FROM raw.instruments --list\n; SELECT country FROM raw.customers"
    expect: refuse
    rule: single_statement
    note: "a line comment ends at the newline; the second statement is still there"
  # ----------------------------------------------------------------- automation
  - id: a36
    user: n8n
    sql: "SELECT trade_date, country, SUM(trades) AS trades FROM mart.daily_trading WHERE trade_date >= DATE '2026-09-21' GROUP BY trade_date, country"
    expect: allow
    masked: []
    note: "internal counts are fine for automation"
  - id: a37
    user: n8n
    sql: "SELECT * FROM raw.trades WHERE executed_at >= current_date() - INTERVAL 1 DAYS LIMIT 500"
    expect: allow
    masked: []
    note: "SELECT * leaves out the financial columns; current_date() expression is a partition filter"
  - id: a38
    user: n8n
    sql: "SELECT country, SUM(fees_eur) FROM mart.daily_trading GROUP BY country"
    expect: refuse
    rule: denied_column
    note: "financial is not visible to automation at all"
  - id: a39
    user: n8n
    sql: "WITH f AS (SELECT customer_id, deposits_eur AS d FROM mart.customer_month) SELECT COUNT(*) FROM f WHERE d > 0"
    expect: refuse
    rule: denied_column
    note: "a CTE over a denied column refuses even though the outer query only counts"
  # --------------------------------------------------------------- unknown user
  - id: a40
    user: mallory
    sql: "SELECT name FROM raw.instruments LIMIT 10"
    expect: refuse
    rule: unknown_user
    note: "users not in the role table are refused"
