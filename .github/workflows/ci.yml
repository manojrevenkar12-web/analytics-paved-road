name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,dbt,spark]"
      - run: ruff check src tests airflow && ruff format --check src tests airflow
      - run: mypy
      - name: contracts lint (breaking changes against the base branch on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            apr lint --base "origin/${{ github.base_ref }}"
          else
            apr lint
          fi
      - name: generated files are current
        run: apr generate && git diff --exit-code
      - name: tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log || { echo "::error title=pytest::$(tail -40 pytest.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

  console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: console}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: console/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  n8n-node:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: integrations/n8n-nodes-paved-road}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: integrations/n8n-nodes-paved-road/package-lock.json}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install promtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.4.1/prometheus-3.4.1.linux-amd64.tar.gz | tar xz
          sudo mv prometheus-3.4.1.linux-amd64/promtool /usr/local/bin/
      - run: promtool check rules deploy/prometheus/rules/slo.rules.yaml
      - name: alert rule tests
        run: |
          set -o pipefail
          cd deploy/prometheus/tests && promtool test rules slo.test.yaml 2>&1 | tee ../../../promtool.log || { echo "::error title=promtool::$(tail -40 ../../../promtool.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install "apache-airflow==3.1.3" apache-airflow-providers-cncf-kubernetes pyyaml pytest --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.12.txt
      - name: DagBag
        env: {AIRFLOW_HOME: /tmp/airflow}
        run: |
          set -o pipefail
          airflow db migrate >/dev/null
          pytest -q airflow/tests 2>&1 | tee af.log || { echo "::error title=airflow::$(tail -40 af.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

  terraform:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: deploy/terraform}}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kind:
    runs-on: ubuntu-latest
    needs: [python]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,spark]"
      - run: docker build -f docker/Dockerfile -t analytics-paved-road:ci .
      - uses: helm/kind-action@v1
        with: {cluster_name: apr, config: deploy/k8s/kind/cluster.yaml}
      - run: kind load docker-image analytics-paved-road:ci --name apr
      - name: deploy
        run: |
          kubectl apply -k deploy
          for d in s3 iceberg-rest apr-gateway; do kubectl -n analytics rollout status deploy/$d --timeout=300s; done
          kubectl -n analytics rollout status deploy/kyuubi --timeout=600s
      - name: diagnostics on failure
        if: failure()
        run: |
          set +e
          {
            kubectl -n analytics get pods -o wide
            kubectl -n analytics get events --sort-by=.lastTimestamp | tail -25
            for p in $(kubectl -n analytics get pods -o name); do echo "== $p"; kubectl -n analytics logs $p --all-containers --tail=15; done
          } > diag.txt 2>&1
          cat diag.txt
          echo "::error title=kind diagnostics::$(tail -c 3500 diag.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          exit 0
      - name: port-forward
        run: |
          kubectl -n analytics port-forward svc/iceberg-rest 8181:8181 >/tmp/pf1.log 2>&1 &
          kubectl -n analytics port-forward svc/s3 9000:9000 >/tmp/pf2.log 2>&1 &
          (while true; do kubectl -n analytics port-forward svc/kyuubi 10009:10009 >>/tmp/pf3.log 2>&1; sleep 1; done) &
          kubectl -n analytics port-forward svc/apr-gateway 8000:8000 >/tmp/pf4.log 2>&1 &
          sleep 5
      - name: ingest three days into S3 through the REST catalog
        env:
          APR_CATALOG: rest
          APR_ICEBERG_REST_URI: http://127.0.0.1:8181
          APR_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: dev
          AWS_SECRET_ACCESS_KEY: dev-only
          AWS_REGION: us-east-1
          APR_WAREHOUSE: /tmp/apr
        run: |
          set -o pipefail
          python -c "from apr.lake.ingest import ingest; runs = ingest(3); assert all(r.status == 'published' for r in runs), runs" 2>&1 | tee ingest.log || {
            echo "::error title=ingest::$(grep -v '^\s*$' ingest.log | tail -n 8 | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            kubectl -n analytics logs deploy/iceberg-rest --tail=400 | grep -E "Exception|Caused by|ERROR|WARN" | grep -v "^\s*at " | tail -n 12 | cut -c1-400 > rest.log
            echo "::error title=rest catalog::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' rest.log)"
            exit 1; }
      - name: the gateway in the cluster answers from the lake
        run: |
          curl -fsS -H 'X-User: pia' -H 'content-type: application/json' \
            -d '{"sql":"SELECT asset_class, COUNT(*) FROM raw.instruments GROUP BY 1"}' http://127.0.0.1:8000/api/query | tee q.json
          python -c "import json; r=json.load(open('q.json')); assert r['status']=='ok' and r['row_count']==4, r"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-User: pia' -H 'content-type: application/json' -d '{"sql":"SELECT email FROM raw.customers"}' http://127.0.0.1:8000/api/query)
          test "$code" = 403
      - name: Spark lane equals the fast lane
        env:
          APR_CATALOG: rest
          APR_ICEBERG_REST_URI: http://127.0.0.1:8181
          APR_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: dev
          AWS_SECRET_ACCESS_KEY: dev-only
          AWS_REGION: us-east-1
          APR_WAREHOUSE: /tmp/apr
          APR_KYUUBI_HOST: 127.0.0.1
        run: |
          set -o pipefail
          # the first session starts the Spark engine inside Kyuubi; wait for it
          python - <<'PY' 2>&1 | tail -n 5
          import time
          from pyhive import hive
          for i in range(40):
              try:
                  c = hive.connect(host="127.0.0.1", port=10009, username="warmup").cursor()
                  c.execute("SELECT 1"); print("engine ready", c.fetchall()); break
              except Exception as e:
                  print("waiting", type(e).__name__, str(e)[:120]); time.sleep(10)
          PY
          pytest -q -m spark --tb=short tests/test_spark_parity.py 2>&1 | tee parity.log || { echo "::error title=parity::$(grep -E '^E |Error|assert|FAILED' parity.log | head -n 25 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; echo "::error title=kyuubi::$(kubectl -n analytics logs deploy/kyuubi --tail=300 | grep -E 'ERROR|Exception|Caused' | grep -v '^\s*at ' | tail -n 12 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, console, n8n-node, promtool, airflow, terraform, kind]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - name: error budget policy (no rollout while a budget is spent)
        run: set -o pipefail; apr budget | tee budget.txt; echo "::notice title=error budgets::$(sed ':a;N;$!ba;s/\n/%0A/g' budget.txt)"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: build and push the image
        run: |
          img=ghcr.io/${{ github.repository_owner }}/analytics-paved-road
          docker build -f docker/Dockerfile -t $img:${{ github.sha }} -t $img:latest .
          docker push $img:${{ github.sha }} && docker push $img:latest
